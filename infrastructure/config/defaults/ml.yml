mlflow:
  tracking_uri: "${MLFLOW_TRACKING_URI_CONTAINER}"
  experiment_name: "Satellite_Dev_Experiments"
  artifact_root: "s3://${S3_MLFLOW_BUCKET}/"

  model_registry:
    default_model_name: "SatelliteSurvivalGB"
    test_alias: "test"
    prod_alias: "prod"

  autolog:
    sklearn: true
    tensorflow: true
    pytorch: false

# ML training config
machine_learning:
  gradient_boosting:
    enabled: false
    n_estimators: 1000
    max_depth: 8
    learning_rate: 0.05
    min_samples_split: 5
    min_samples_leaf: 3
    subsample: 0.8
    validation_fraction: 0.2
    n_iter_no_change: 50

  lstm:
    enabled: true
    sequence_length: 30
    lstm_units: [ 128, 64, 32 ]
    attention_heads: 8
    dropout_rate: 0.3
    learning_rate: 0.001
    batch_size: 32
    epochs: 100
    patience: 15

  features:
    enable_atmospheric_features: true
    enable_orbital_features: true