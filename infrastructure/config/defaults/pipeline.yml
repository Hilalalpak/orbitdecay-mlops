# Data paths
paths:

  s3_buckets:
    pipeline_cache: "pipeline-cache"
    pipeline_state: "pipeline-state"
    satellite_data: "orbit-data"
    env_data: "environment-data"
    training_store: "training-store"
    mlflow_artifacts: "${S3_MLFLOW_BUCKET}"

    metadata: "smart-metadata"
    compliance: "api-compliance"

  s3_prefixes:
    omm_leo: "omm/leo"
    orbit_cache: "cache/orbit-batches"
    orbit_procc_receipts: "run-receipts/orbit-processing"
    orbit_processed: "processed"
    orbit_feat_receipts: "run-receipts/orbit-featured"
    orbit_featured: "featured"
    env_cache: "cache/environment-data"
    env_processed: "processed"
    env_procc_receipts: "run-receipts/environment-processed"
    env_featured: "featured"
    env_feat_receipts: "run-receipts/environment-featured"
    satcat: "catalog/satellites"
    training_data_receipts: "run-receipts/training-data"
    api_compliance: "api-compliance"

# Data sources
data_sources:
  space_track:
    enable_burst_protection: true

    base_url: "${SPACE_TRACK_BASE_URL}"
    username: "${SPACE_TRACK_USERNAME}"
    password: "${SPACE_TRACK_PASSWORD}"

    max_daily_requests: 200
    hourly_limit: 30
    burst_limit: 15
    api_delay: 10
    rate_limit_buffer: 5
    session_timeout: 60
    max_retries: 3

    batch_size: 10
    use_test_server: false

    endpoints:
      current_data: "class/gp"
      historical_data: "class/gp_history"

  solar_flux:
    url: "https://spaceweather.gc.ca/solar_flux_data/daily_flux_values/fluxtable.txt"

  kp_indices:
    url: "https://kp.gfz-potsdam.de/app/files/Kp_ap_since_1932.txt"

  sunspot:
    url: "https://www.sidc.be/SILSO/INFO/sndtotcsv.php"

# Smart collection
smart_collection:
  enable_auto_cleanup: true
  enable_duplicate_detection: true
  enable_parameter_hashing: true
  enable_smart_caching: true

  incremental_updates:
    enabled: true
    max_incremental_days: 30
    overlap_hours: 24

  cache:
    default_ttl_days: 3
    force_refresh_days: 7
    max_cache_size_mb: 1000

  metadata:
    file_path: "run-history/pipeline_runs.json"
    max_history_entries: 100

  performance:
    enable_parallel_cache_ops: true
    cache_compression: true