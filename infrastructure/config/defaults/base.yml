environment:
  name: "${ENVIRONMENT}"
  debug: "${DEBUG:-true}"

# Scheduling config
scheduling:
  daily_reports:
    enabled: true
    schedule: "0 6 * * *"
    timezone: "Europe/Istanbul"

  pipeline:
    enabled: true
    schedule: "0 2 * * *"
    max_execution_time: 7200

  model_training:
    enabled: true
    schedule: "0 0 * * 0"
    min_new_data_days: 7

# Logging
logging:
  level: "${LOG_LEVEL:-INFO}"

  files:
    main: 'logs/space_track.log'
    pipeline: 'logs/pipeline_execution.log'
    api: 'logs/api_server.log'
    features: 'logs/feature_engineering.log'
    timeseries: 'logs/timeseries_creation.log'
    space_weather: 'logs/space_weather_processing.log'
    collection: 'logs/collection.log'
    compliance: 'logs/quota_manager.log'