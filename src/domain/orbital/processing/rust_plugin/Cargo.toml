[package]
name = "orbital_plugin"
version = "0.1.0"
edition = "2021"

[lib]
name = "orbital_plugin"
crate-type = ["cdylib"]

[dependencies]
# Pinning Polars to 0.40.0 to maintain compatibility with the Python environment
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py38"] }
pyo3-polars = { version = "0.14", features = ["derive"] }
polars = { version = "0.40", features = ["dtype-struct", "fmt", "performant"], default-features = false }

sgp4 = "0.4"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = "fat"
strip = "symbols"
opt-level = 3